name: CI - Earthquake ML Training Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      - name: Check Env
        run: |
          python --version
          pip --version
          echo "Runner: ${{ runner.os }}"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn==1.6.0 \
                      pandas numpy matplotlib seaborn dagshub

      - name: Set MLflow Tracking URI
        run: |
          echo "MLFLOW_TRACKING_URI=https://dagshub.com/${{ secrets.DAGSHUB_USERNAME }}/mlsystem-earthquake.mlflow" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_USERNAME=${{ secrets.DAGSHUB_USERNAME }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.DAGSHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Run mlflow project
        run: |
          set -o pipefail
          mlflow run MLProject \
            --env-manager=local \
            --experiment-name "Earthquake-CI" \
            -P n_estimators=100 \
            -P max_depth=10 \
            -P min_samples_split=2 2>&1 | tee /tmp/mlflow_out.txt
          RUN_ID=$(grep -oP "run with ID '\K[a-f0-9]+" /tmp/mlflow_out.txt | tail -1)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Captured Run ID: $RUN_ID"
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}

      - name: Upload to Google Drive
        uses: actions/upload-artifact@v4
        with:
          name: earthquake-mlflow-artifacts-${{ env.RUN_ID }}
          path: mlruns/
          if-no-files-found: warn
          retention-days: 30

      - name: Download model artifacts
        run: |
          python - <<'EOF'
          import mlflow, os
          mlflow.set_tracking_uri(os.environ["MLFLOW_TRACKING_URI"])
          mlflow.artifacts.download_artifacts(
              run_id=os.environ["RUN_ID"],
              artifact_path="model",
              dst_path="MLProject/",
          )
          EOF
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          RUN_ID: ${{ env.RUN_ID }}

      - name: Build Docker Model
        run: docker build -t earthquake-ml-model MLProject/

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag earthquake-ml-model \
            ${{ secrets.DOCKERHUB_USERNAME }}/earthquake-ml-model:latest
          docker tag earthquake-ml-model \
            ${{ secrets.DOCKERHUB_USERNAME }}/earthquake-ml-model:${{ env.RUN_ID }}

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/earthquake-ml-model:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/earthquake-ml-model:${{ env.RUN_ID }}
